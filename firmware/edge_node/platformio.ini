; AquaSentinel edge node (ESP32, Arduino framework).
; The platform and every library are pinned to exact versions so each build uses the same toolchain:
; espressif32 6.13.0 is the last 6.x release and carries Arduino-ESP32 2.0.x. An unpinned build pulls the
; newest platform (8.0.0 with Arduino-ESP32 3.x on 20 Oct 2026), which changes types and APIs under the code.
;
; esp32dev = field build (15-minute deep-sleep cycle)
; bench    = table demo for the 19-20 Nov finale (see ../BENCH_DEMO_PLAN.md)

[env]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    bblanchon/ArduinoJson @ 6.21.6

[env:esp32dev]

[env:bench]
build_flags =
    ${env.build_flags}
    -D BENCH_DEMO
