<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="Segoe UI, Arial, sans-serif">
<defs>
<marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#c0001a"/></marker>
</defs>
<rect x="0" y="0" width="860" height="300" fill="#ffffff"/>
<text x="430" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#c0001a">Power: ONE 5 V input, then 9 V and 4.0 V are made on the board</text>

<!-- source -->
<rect x="24" y="120" width="170" height="64" rx="8" fill="#fff4e6" stroke="#c07f00" stroke-width="1.5"/>
<text x="109" y="148" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8a5a00">AUX 5 V charger</text>
<text x="109" y="168" text-anchor="middle" font-size="9.5" fill="#8a5a00">(the bench "AUX" supply,</text>
<text x="109" y="181" text-anchor="middle" font-size="9.5" fill="#8a5a00">NOT the old 12 V adapter)</text>

<!-- J12 -->
<rect x="254" y="120" width="150" height="64" rx="8" fill="#0b3d62"/>
<text x="329" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">J12 — AUX 5 V in</text>
<text x="329" y="168" text-anchor="middle" font-size="9.5" fill="#cfe3f2">screw terminal + / −</text>
<line x1="194" y1="152" x2="254" y2="152" stroke="#c0001a" stroke-width="2.5" marker-end="url(#arr2)"/>

<!-- 5V rail branches -->
<rect x="464" y="52" width="200" height="52" rx="8" fill="#eef7f0" stroke="#1b7a32" stroke-width="1.5"/>
<text x="564" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#1b7a32">Sensors' 5 V rail</text>
<text x="564" y="92" text-anchor="middle" font-size="9.5" fill="#1b7a32">J1 MQ-3 · J2 turbidity · J3 LDR · J4 DHT11 · J5 DS18B20 · J9 TDS</text>
<rect x="464" y="126" width="200" height="52" rx="8" fill="#eef7f0" stroke="#1b7a32" stroke-width="1.5"/>
<text x="564" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#1b7a32">J13 — pump power out</text>
<text x="564" y="166" text-anchor="middle" font-size="9.5" fill="#1b7a32">to the Mini L298N driver</text>
<rect x="464" y="200" width="200" height="52" rx="8" fill="#eef7f0" stroke="#1b7a32" stroke-width="1.5"/>
<text x="564" y="222" text-anchor="middle" font-size="11" font-weight="700" fill="#1b7a32">J14 — step-up module IN</text>
<text x="564" y="240" text-anchor="middle" font-size="9.5" fill="#1b7a32">(turns 5 V into 9 V)</text>
<line x1="404" y1="152" x2="464" y2="152" stroke="#c0001a" stroke-width="2" marker-end="url(#arr2)"/>
<line x1="404" y1="152" x2="464" y2="78" stroke="#c0001a" stroke-width="2" marker-end="url(#arr2)"/>
<line x1="404" y1="152" x2="464" y2="226" stroke="#c0001a" stroke-width="2" marker-end="url(#arr2)"/>

<!-- 9V and 4.0V consumers -->
<rect x="714" y="130" width="130" height="52" rx="8" fill="#eef7f0" stroke="#1b7a32" stroke-width="1.5"/>
<text x="779" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#1b7a32">J15 — pH board</text>
<text x="779" y="170" text-anchor="middle" font-size="9.5" fill="#1b7a32">9 V + GND</text>
<rect x="714" y="212" width="130" height="62" rx="8" fill="#eef7f0" stroke="#1b7a32" stroke-width="1.5"/>
<text x="779" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#1b7a32">J16 step-down → J17</text>
<text x="779" y="250" text-anchor="middle" font-size="9.5" fill="#1b7a32">4.0 V to the SIM800L</text>
<text x="779" y="266" text-anchor="middle" font-size="9.5" fill="#1b7a32">(1000 µF C2 on board)</text>
<line x1="664" y1="226" x2="714" y2="156" stroke="#1b7a32" stroke-width="2" marker-end="url(#arr2)"/>
<line x1="664" y1="226" x2="714" y2="243" stroke="#1b7a32" stroke-width="2" marker-end="url(#arr2)"/>
<text x="700" y="118" text-anchor="middle" font-size="9.5" fill="#1b7a32">9 V rail</text>
<text x="700" y="292" text-anchor="middle" font-size="9.5" fill="#c0001a">set step-up OUT = 9.0 V · set step-down OUT = 4.0 V · measure BEFORE connecting anything</text>
</svg>
