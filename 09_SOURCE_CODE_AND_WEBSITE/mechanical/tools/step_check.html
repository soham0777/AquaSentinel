<script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.js"></script></head>
<body style="font:12px monospace"><h3>OpenCASCADE (occt-import-js) STEP read check</h3><pre id="o">loading...</pre>

function count(node){let n=node.meshes.length;for(const c of node.children)n+=count(c);return n;}
function names(node,acc){if(node.name)acc.push(node.name);for(const c of node.children)names(c,acc);return acc;}
occtimportjs().then(async occt => {
  const out=[]; const o=document.getElementById('o'); o.textContent='';
  for (const f of FILES){
    const t0=performance.now();
    try{
      const buf=new Uint8Array(await (await fetch('../'+f)).arrayBuffer());
      const r=occt.ReadStepFile(buf,null);
      let tris=0, lo=[1e9,1e9,1e9], hi=[-1e9,-1e9,-1e9];
      for(const m of r.meshes){tris+=m.index.array.length/3; const p=m.attributes.position.array;
        for(let i=0;i<p.length;i+=3){for(let k=0;k<3;k++){lo[k]=Math.min(lo[k],p[i+k]);hi[k]=Math.max(hi[k],p[i+k]);}}}
      const rec={file:f,success:r.success,meshes:r.meshes.length,triangles:tris,
        bbox_mm:[lo.map(v=>+v.toFixed(1)),hi.map(v=>+v.toFixed(1))],
        nodes:r.root?names(r.root,[]).length:0, first_names:r.root?names(r.root,[]).slice(0,6):[], ms:Math.round(performance.now()-t0)};
      out.push(rec); o.textContent+=JSON.stringify(rec)+'\n';
    }catch(e){out.push({file:f,success:false,error:String(e)}); o.textContent+=f+' ERROR '+e+'\n';}
  }
  await fetch('/save?path=checks/step_validation.json',{method:'POST',body:JSON.stringify(out,null,1)});
  o.textContent+='\nDONE '+out.filter(r=>r.success&&r.meshes>0).length+'/'+out.length+' files read with geometry';
  document.title='STEP check DONE';
});
</script></body></html>
